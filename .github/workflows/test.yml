name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          ini-values:  zend.assertions=1,  assert.exception=1

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run the unit tests
        run: vendor/bin/phpunit --testdox

      - name: Run doctest on its own examples
        run: |
          php bin/doctest examples/Ratio.php

          # factorial.php documents 3 deliberate failures (see its docblocks):
          # assert the run fails, and fails for the documented reasons
          if php bin/doctest examples/factorial.php > /tmp/doctest.log; then
            echo "::error::expected factorial.php examples to fail, but they passed"
            exit 1
          fi
          sed 's/\x1b\[[0-9;]*m//g' /tmp/doctest.log > /tmp/doctest-clean.log
          for expected in \
            'Expected no output. Got: "720"' \
            'unexpected negative integer: -10' \
            'Expected a value equal to 3628890. Got: 3628800'; do
            if ! grep -qF "$expected" /tmp/doctest-clean.log; then
              echo "::error::expected failure message not found: $expected"
              grep -F 'Error:' /tmp/doctest-clean.log || true
              exit 1
            fi
          done

      - name: Run Mago
        run: |
          vendor/bin/mago format --check
          vendor/bin/mago lint
          vendor/bin/mago analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
