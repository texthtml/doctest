name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: ${{ matrix.php-versions == '8.5' && 'pcov' || 'none' }}
          ini-values:  zend.assertions=1,  assert.exception=1

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run the unit tests
        run: vendor/bin/phpunit --testdox

      - name: Run the unit tests with coverage (PHP 8.5)
        if: matrix.php-versions == '8.5'
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov (PHP 8.5)
        if: matrix.php-versions == '8.5'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: php-${{ matrix.php-versions }}
          fail_ci_if_error: true

      - name: Run doctest on its own examples
        run: scripts/check-example-output.sh

      - name: Run Mago
        run: |
          vendor/bin/mago format --check
          vendor/bin/mago lint
          vendor/bin/mago analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
